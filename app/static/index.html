<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QuietBoard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1d1d1b;--tx2:#6b6b66;--tx3:#9a9a94;--bd:#e3e2dc;--ok:#3b8a2e;--bad:#c93a3a;--warn:#c98a12;--acc:#2f6fd0;--chip:#efeee9;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--tx:#e9e9e6;--tx2:#a5a7ab;--tx3:#73767c;--bd:#2c313a;--chip:#252a33;--ok:#5cb84a;--bad:#e05757;--warn:#e0a735;--acc:#6aa0f0}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;font-weight:600;margin:0}header small{color:var(--tx3);font-size:12px}
header button{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:8px;padding:4px 10px;font-size:13px}
main{padding:0 14px calc(env(safe-area-inset-bottom) + 84px);max-width:640px;margin:0 auto}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.kc b{display:block;font-size:22px;font-weight:600}.kc span{font-size:12px;color:var(--tx2)}
.kc .ks{display:block;font-size:11px;margin-top:2px}
.sec{font-size:12px;color:var(--tx2);margin:18px 2px 6px;text-transform:none;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.it+.it{border-top:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--tx3)}
.d.ok{background:var(--ok)}.d.bad{background:var(--bad)}.d.warn{background:var(--warn)}.d.run{background:var(--acc)}
.n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--tx2);font-size:13px;white-space:nowrap}
.cv{color:var(--tx3);transition:transform .15s;font-size:12px}.op .cv{transform:rotate(180deg)}
.bd{display:none;padding:0 12px 12px 31px}.op .bd{display:block}
.log{background:var(--chip);border-radius:8px;padding:8px 10px;font:12px/1.5 var(--mono);color:var(--tx2);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);padding:2px 0}
.tr{height:5px;background:var(--chip);border-radius:3px;margin:2px 0 6px}.tr i{display:block;height:5px;border-radius:3px}
.bt{background:none;border:1px solid var(--bd);color:var(--acc);border-radius:8px;padding:4px 10px;font-size:13px;margin-left:6px}
.lk{display:inline-block;margin-top:6px;margin-right:14px;font-size:13px;color:var(--acc);text-decoration:none}
.err{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.empty{color:var(--tx2);font-size:14px;padding:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--tx2);margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--tx3);font-size:11px;padding:4px 0}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav button.ac{color:var(--acc)}
.fm{display:grid;gap:8px;padding:12px}.fm label{display:grid;gap:3px;font-size:12px;color:var(--tx2)}
.fm input,.fm select,select.sm{font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
select.sm{width:auto;padding:3px 6px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px}.row+.row{border-top:1px solid var(--bd)}
.pb{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:8px;padding:8px 12px}
.msg{font-size:13px;color:var(--tx2);padding:0 12px 10px}.msg.e{color:var(--bad)}
.cmd{display:block;background:var(--chip);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);word-break:break-all;user-select:all}
</style>
</head>
<body>
<header><div><h1 id="title">Übersicht</h1><small id="gen">lädt …</small></div><button id="reload" aria-label="Neu laden">↻</button></header>
<main id="v"><div class="empty">Lade Status …</div></main>
<nav id="nav"></nav>
<script>
const ICON={ov:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',ho:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',jo:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',up:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',sy:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
const TABS=[['ov','Übersicht'],['ho','Hosts'],['jo','Jobs'],['up','Updates'],['sy','System']];
let ME=null,SY=null,SET=null,USERS=null,CMD=null,AG=null,MSG={};const isAdmin=()=>ME&&ME.role==='admin';
let S=null,tab=localStorage.getItem('tab')||'ov';const open=new Set();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'–':Math.round(v)+' %';
const bar=p=>`<div class="tr"><i style="width:${Math.min(p||0,100)}%;background:var(--${p>=90?'bad':p>=80?'warn':'ok'})"></i></div>`;
function rel(iso){if(!iso)return'nie';const s=(Date.now()-new Date(iso))/1000;if(s<90)return'gerade';if(s<3600)return Math.round(s/60)+' min';if(s<86400){const d=new Date(iso);return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}return Math.round(s/86400)+' Tg.'}
function dur(sec){if(sec==null)return'';sec=Math.round(sec);return sec<60?sec+' s':sec<3600?Math.round(sec/60)+' min':(sec/3600).toFixed(1)+' h'}
const CS={up:'ok',new:'',paused:'',grace:'warn',down:'bad',started:'run'};
function chkMeta(c){if(c.status==='started')return c.last_ping?'läuft seit '+rel(c.last_ping):'läuft';if(c.status==='down')return'fehlt/fehler';if(c.status==='grace')return'überfällig';if(c.status==='new')return'neu';if(c.status==='paused')return'pausiert';return rel(c.last_ping)+(c.last_duration?' · '+dur(c.last_duration):'')}
function item(id,dot,name,meta,body){return`<div class="it${open.has(id)?' op':''}" data-id="${esc(id)}"><div class="hd"><span class="d ${dot}"></span><span class="n">${name}</span><span class="m">${meta}</span><span class="cv">▾</span></div><div class="bd">${body}</div></div>`}
function chkAdmin(c){if(!isAdmin()||!c.uuid)return'';return`<div class="kv" style="margin-top:8px;align-items:center"><span>Priorität <select class="sm" data-prio="${esc(c.uuid)}">${['kritisch','normal','info'].map(p=>`<option${p===c.prio?' selected':''}>${p}</option>`).join('')}</select></span><span>${c.status==='paused'?`<button class="bt" data-ck="resume:${esc(c.uuid)}">Fortsetzen</button>`:`<button class="bt" data-ck="pause:${esc(c.uuid)}">Pausieren</button>`}<button class="bt" data-job="edit:${esc(c.uuid)}">Bearbeiten</button><button class="bt" data-job="del:${esc(c.uuid)}">Löschen</button></span></div>`}
function chkItem(c,label){return item('c:'+c.uuid,CS[c.status]||'',esc(label??c.name)+(c.prio&&c.prio!=='normal'?`<span class="tag">${esc(c.prio)}</span>`:''),esc(chkMeta(c)),`<div class="log" data-log="${esc(c.uuid)}">Lade Log …</div>${chkAdmin(c)}${chkGuide(c)}<a class="lk" href="${esc(S.links.hc)}" target="_blank" rel="noopener">Verlauf in Healthchecks ↗</a>`)}
// ---- Jobs in der Oberfläche anlegen, bearbeiten, löschen; Anleitungen je Meldeweg
let JOBF=null,JH=null,JDONE=null;
const JT={backup:{label:'Backup-Skript (restic, borg, rsync …)',src:'hc',typ:'backup',mode:'cron',schedule:'0 3 * * *',grace:'2h',prio:'kritisch'},
hc:{label:'Skript oder Cronjob auf einem Host',src:'hc',typ:'skript',mode:'cron',schedule:'0 4 * * *',grace:'1h',prio:'normal'},
cert:{label:'Zertifikat erneuern (certbot, acme.sh …)',src:'hc',typ:'zertifikat',mode:'period',period:'1d',grace:'6h',prio:'normal'},
pve:{label:'Proxmox VE: Backup-Job (vzdump)',src:'pve',typ:'backup',ev:'vzdump',mode:'cron',schedule:'0 1 * * *',grace:'3h',prio:'kritisch'},
pbs:{label:'Proxmox Backup Server: Verify, GC, Prune, Sync',src:'pbs',typ:'verify',ev:'verify',mode:'cron',schedule:'0 5 * * *',grace:'3h',prio:'normal'},
url:{label:'Andere Software mit Ping-URL (Backrest …)',src:'url',typ:'backup',mode:'cron',schedule:'0 2 * * *',grace:'2h',prio:'normal'}};
const SRC={hc:'Helfer hc auf dem Host',url:'Ping-URL (andere Software)',pve:'Proxmox VE (Webhook)',pbs:'Proxmox Backup Server (Webhook)'};
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);return new Promise((ok,no)=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:-1000px;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();r?ok():no()})}
const cp=(t,label)=>`<code class="cmd">${esc(t)}</code><span><button type="button" class="bt" style="margin:0" data-copy="${esc(t)}">${label||'Kopieren'}</button></span>`;
const hint=t=>`<span style="font-size:12px;color:var(--tx3)">${t}</span>`;
function guide(f){const sl=f.slug,src=f.src||'hc';let o='';
if(src==='hc'){const cr=(f.mode!=='period'&&f.schedule)||'0 3 * * *';
o+=hint(`Auf <b>${esc(f.host||'dem Host')}</b> den Befehl vor das eigentliche Skript setzen. <code>hc</code> meldet Start, Ende, Exitcode und die letzten Zeilen der Ausgabe – es ist auf jedem Host installiert, der über „Host hinzufügen“ angebunden wurde.`)+cp(`hc run ${sl} -- /pfad/zum/skript.sh`);
o+=hint('Als Cronjob, z. B. in <code>/etc/cron.d/quietboard</code>:')+cp(`${cr} root /usr/local/bin/hc run ${sl} -- /pfad/zum/skript.sh`);
o+=hint('Oder in einem systemd-Service:')+cp(`ExecStart=/usr/local/bin/hc run ${sl} -- /pfad/zum/skript.sh`)}
else if(src==='url'){const u=(JH?.ping_url||'<ping-url>')+'/'+sl;
o+=hint('Diese Adresse am Ende eines erfolgreichen Laufs aufrufen. <code>/start</code> angehängt meldet den Start, <code>/fail</code> einen Fehler. In Backrest: Plan → Hooks → Healthchecks, diese URL eintragen.')+cp(u,'Adresse kopieren');
o+=hint('Aus einem Skript:')+cp(`curl -fsS -m 10 --retry 3 ${u} >/dev/null`)}
else{const pbs=src==='pbs',url=`${JH?.webhook||'<server>/api/ingest/pve'}?source=${src}&host=${f.host}`;
o+=hint(`Einmal pro ${pbs?'Proxmox Backup Server':'Proxmox VE'} einrichten – weitere Jobs auf demselben Host brauchen nur einen Eintrag hier.<br>1. ${pbs?'Configuration':'Datacenter'} → Notifications → Notification Targets → Add → <b>Webhook</b>, Name <code>quietboard</code>, Method <code>POST</code>, URL:`)+cp(url);
o+=hint('2. Header <code>Content-Type</code> = <code>application/json</code> und <code>Authorization</code> = <code>Bearer {{ secrets.token }}</code>. Unter Secrets einen Eintrag <code>token</code> mit diesem Wert:')+cp(JH?.token||'<INGEST_TOKEN>','Token kopieren');
o+=hint('3. Body:')+cp('{"severity":"{{ severity }}","title":{{ json title }},"message":{{ json message }},"fields":{{ json fields }}}');
o+=hint(`4. Notification Matchers → Add → Target <code>quietboard</code>. ${pbs?'Im Datastore unter Options → Notification „Notification System“ wählen.':'Im Backup-Job bei Notification „Notification system“ wählen.'}<br>5. Mit „Test“ prüfen: Unter Übersicht → Meldungen erscheint ein Eintrag. Ein erfolgreicher Lauf meldet diesen Job grün, ein Fehler rot.`)}
return `<div class="fm" style="padding:8px 0 0">${o}</div>`}
function chkGuide(c){if(!isAdmin()||!c.slug)return'';const f={slug:c.slug,src:c.src||'hc',host:c.host,ev:(c.match?.type||[]).join(',')};return`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--acc);font-size:13px">So meldet sich dieser Job</summary>${guide(f)}</details>`}
function jobForm(){const v=JOBF.v,ed=JOBF.mode==='edit',sel=(n,opts,cur)=>`<select name="${n}" data-jf>${opts.map(([k,l])=>`<option value="${esc(k)}"${k===cur?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
const px=v.src==='pve'||v.src==='pbs';let o=`<form class="fm" data-form="job">`;
if(!ed)o+=`<label>Was soll überwacht werden?${sel('tpl',Object.entries(JT).map(([k,t])=>[k,t.label]),v.tpl)}</label>`;
o+=`<label>${px?'Proxmox-Host (Name wie in der Webhook-Adresse)':'Host'}<input name="host" list="jhosts" value="${esc(v.host||'')}" ${ed?'readonly':'required'} placeholder="z. B. docker01" autocapitalize="off"></label><datalist id="jhosts">${(JH?.hosts||[]).map(h=>`<option value="${esc(h)}">`).join('')}</datalist>`;
o+=`<label>Name des Jobs<input name="job" value="${esc(v.job||'')}" ${ed?'readonly':'required'} placeholder="z. B. restic-offsite" autocapitalize="off"></label>`;
o+=`<label>Wann läuft er?${sel('mode',[['cron','zu festen Zeiten (Cron)'],['period','regelmäßig alle …']],v.mode)}</label>`;
o+=v.mode==='period'?`<label>Intervall<input name="period" value="${esc(v.period||'1d')}" placeholder="1d"></label>${hint('z. B. 30m, 12h, 1d, 7d')}`:`<label>Zeitplan (Cron)<input name="schedule" value="${esc(v.schedule||'')}" placeholder="0 3 * * *"></label>${hint(`Minute Stunde Tag Monat Wochentag · <code>0 3 * * *</code> täglich 3:00 · <code>30 2 * * 0</code> sonntags 2:30 · Zeitzone ${esc(v.tz||JH?.tz||'')}`)}<input type="hidden" name="tz" value="${esc(v.tz||JH?.tz||'')}">`;
o+=`<label>Darf dauern bzw. sich verspäten, bevor es Alarm gibt<input name="grace" value="${esc(v.grace||'1h')}" placeholder="2h"></label>`;
o+=`<label>Priorität${sel('prio',[['kritisch','kritisch – sofort melden'],['normal','normal – melden'],['info','info – nur anzeigen']],v.prio)}</label>`;
o+=`<label>Art${sel('typ',(JH?.types||['backup','skript']).map(t=>[t,t]),v.typ)}</label>`;
o+=`<label>Wie meldet er sich?${sel('src',Object.entries(SRC),v.src)}</label>`;
if(px)o+=`<label>Ereignis${sel('ev',(v.src==='pve'?[['vzdump','vzdump (Backup)'],['replication','replication']]:[['verify','verify'],['gc','gc (Garbage Collection)'],['prune','prune'],['sync','sync']]).concat(v.ev&&!['vzdump','replication','verify','gc','prune','sync'].includes(v.ev)?[[v.ev,v.ev]]:[]),v.ev)}</label><label>Nur Job-ID (optional)<input name="job_id" value="${esc(v.job_id||'')}" placeholder="z. B. backup-1a2b3c"></label>${v.src==='pbs'?`<label>Nur Datastore (optional)<input name="ds" value="${esc(v.ds||'')}" placeholder="z. B. store1"></label>`:''}`;
o+=`<label>Notiz (optional)<input name="desc" value="${esc(v.desc||'')}"></label>`;
o+=`<span style="display:flex;gap:8px"><button class="pb">${ed?'Speichern':'Job anlegen'}</button><button type="button" class="bt" data-job="cancel">Abbrechen</button></span></form>${msg('job')}`;
return `<div class="sec">${ed?'Job bearbeiten: '+esc(v.host+'/'+v.job):'Neuer Job'}</div><div class="card">${o}</div>`}
function jobDone(){const f=JDONE;return`<div class="sec">Angelegt: ${esc(f.host+'/'+f.job)}</div><div class="card"><div class="fm">${hint('Der Job steht jetzt auf „neu“ und wird grün, sobald er sich das erste Mal meldet. So meldet er sich:')}${guide(f)}<span><button type="button" class="bt" style="margin:0" data-job="done">Fertig</button></span></div></div>`}
async function ensureJH(){if(!JH&&isAdmin()){try{JH=await jget('/api/jobs/help')}catch(e){}}}
function jobVals(){const f=document.querySelector('[data-form="job"]');return f?Object.fromEntries(new FormData(f)):{}}
function hostItem(h){const jobs=S.checks.filter(c=>c.host===h.name),upd=S.updates.filter(u=>u.host===h.name);const st=h.status==='up'?'ok':(h.always_on?'bad':'');
const meta=h.status==='up'?`${pct(h.cpu)} · ${pct(h.mem)}`:(h.always_on?h.status:'aus (geplant) · '+rel(h.updated));
const body=`<div class="kv"><span>CPU</span><span>${pct(h.cpu)}</span></div><div class="kv"><span>RAM</span><span>${pct(h.mem)}</span></div>${bar(h.mem)}<div class="kv"><span>Disk</span><span>${pct(h.disk)}</span></div>${bar(h.disk)}<div class="kv"><span>Agent</span><span>${esc(h.agent||'–')}</span></div>${jobs.length?`<div class="sec">Jobs</div>`+jobs.map(c=>`<div class="kv"><span><span class="d ${CS[c.status]||''}" style="display:inline-block;margin-right:6px"></span>${esc(c.name.split('/').pop())}</span><span>${esc(chkMeta(c))}</span></div>`).join(''):''}${upd.length?`<div class="sec">Updates</div>`+upd.map(u=>`<div class="kv"><span>${esc(u.kind)}</span><span>${u.items.length}${u.items.some(i=>i.security)?' · Security':''}</span></div>`).join(''):''}${(S.host_updates||[]).some(x=>x.host===h.name&&x.reboot)?'<div class="kv"><span>Kernel</span><span style="color:var(--warn)">Neustart nötig</span></div>':''}${(h.links||[]).map(l=>`<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${l.vpn?' (VPN)':''} ↗</a>`).join('')}<a class="lk" href="${esc(S.links.beszel)}/system/${esc(h.id)}" target="_blank" rel="noopener">Verlauf in Beszel ↗</a>`;
return item('h:'+h.name,st,esc(h.name),esc(meta),body)}
const KIND={apt:'apt',dsm:'DSM',docker:'Docker-Images',scanner:'DockHand-Scanner',mailcow:'Mailcow'};
function hupItem(h){const us=S.updates.filter(u=>u.host===h.host);
const meta=[h.packages?h.packages+(h.packages===1?' Paket':' Pakete'):'',h.security?(h.sec_overdue?'⚠ ':'')+h.security+' Security':'',h.reboot?'Neustart nötig':''].filter(Boolean).join(' · ');
const body=us.map(u=>`<div class="sec">${esc(KIND[u.kind]||u.kind)}</div><div class="log">${u.items.map(i=>esc(i.pkg+(i.from?'  '+i.from:'')+' → '+i.to+(i.security?'  [Security'+(i.since?', offen seit '+rel(i.since):'')+']':''))).join('\n')}</div><div class="kv"><span>Stand</span><span>${esc(rel(u.checked))}</span></div>`).join('')+(h.reboot?'<div class="kv"><span>Kernel</span><span style="color:var(--warn)">Neustart nötig</span></div>':'');
return item('uh:'+h.host,h.sec_overdue?'bad':'warn',esc(h.host)+h.kinds.map(k=>`<span class="tag">${esc(k)}</span>`).join(''),esc(meta),body)}
function updItem(u){const sec=u.items.some(i=>i.security);return item('u:'+u.host+u.kind,sec?'bad':'warn',esc(u.host)+`<span class="tag">${esc(u.kind)}</span>`,esc(u.items.length+(u.items.length===1?' Paket':' Pakete')+(sec?' · Security':'')),`<div class="log">${u.items.map(i=>esc(i.pkg+(i.from?'  '+i.from:'')+' → '+i.to+(i.security?'  [Security]':''))).join('\n')}</div><div class="kv"><span>Stand</span><span>${esc(rel(u.checked))}</span></div>`)}
const msg=k=>MSG[k]?`<div class="msg${MSG[k].e?' e':''}">${esc(MSG[k].t)}</div>`:'';
const dot=ok=>`<span class="d ${ok?'ok':'bad'}" style="display:inline-block;margin-right:8px"></span>`;
function syView(){let o='';
o+=`<div class="sec">Konto</div><div class="card"><div class="row"><span>${esc(ME?.email||'–')}<span class="tag">${ME?.role==='admin'?'Admin':'Betrachter'}</span></span>${ME?.via?'':'<button class="bt" data-sy="logout">Abmelden</button>'}</div>${ME&&!ME.via?`<details class="row" style="display:block"><summary style="cursor:pointer;color:var(--acc);font-size:13px">Passwort ändern</summary><form class="fm" data-form="pw" style="padding:8px 0 0"><label>Bisheriges Passwort<input type="password" name="old" autocomplete="current-password" required></label><label>Neues Passwort (min. 10 Zeichen)<input type="password" name="new" autocomplete="new-password" minlength="10" required></label><button class="pb">Ändern</button></form></details>`:''}${msg('pw')}</div>`;
if(isAdmin()){o+=`<div class="sec">Host hinzufügen</div><div class="card"><div class="fm"><span style="font-size:13px;color:var(--tx2)">Auf dem Host (Debian/Ubuntu, als root oder mit sudo) ausführen. Installiert Beszel-Agent (Docker, sonst Binary), <code>hc</code>, Update-Bericht und automatische Sicherheitsupdates. Der Host erscheint danach unter „Hosts“.</span>${CMD?`<code class="cmd" id="cmd">${esc(CMD)}</code><span style="display:flex;gap:8px"><button class="pb" data-copy="${esc(CMD)}">Kopieren</button></span><span style="font-size:12px;color:var(--tx3)">Optional vor <code>bash</code>: <code>QB_HOST=name</code>, <code>QB_AGENT_MODE=binary</code>, <code>QB_SECURITY_UPDATES=0</code>. Synology wird erkannt (vorhandener Agent bleibt). Der Befehl enthält einen Zugangsschlüssel – nicht öffentlich teilen.</span>${AG?`<details><summary style="cursor:pointer;color:var(--acc);font-size:13px">Manuell: vorhandener Agent, Docker-Stack, NAS-Oberfläche</summary><code class="cmd" style="margin-top:6px">KEY=${esc(AG.key)}\nTOKEN=${esc(AG.token)}\nHUB_URL=${esc(AG.hub_url)}</code><span style="font-size:12px;color:var(--tx3)">Diese drei Werte im Agent eintragen (Umgebung bzw. Stack), Agent neu starten – er meldet sich selbst an. Docker-Stack: siehe Doku „Hosts anbinden“.</span></details>`:''}`:'<button class="pb" data-sy="cmd">Befehl anzeigen</button>'}</div>${msg('cmd')}</div>`}
const ch=SET?.channels||{};
o+=`<div class="sec">Benachrichtigungen</div><div class="card">`;
o+=`<div class="row"><span>${dot(ch.mail)}Mail${ch.mail?'':' <span class="tag">SMTP in .env fehlt</span>'}</span>${isAdmin()&&ch.mail?'<button class="bt" data-test="mail">Test senden</button>':''}</div>`;
o+=`<div class="row"><span>${dot(ch.push)}Web Push (dieses Gerät unten)</span><span>${SY?.push_devices??0} Gerät(e)</span></div>`;
o+=`<div class="row"><span>${dot(ch.signal)}Signal${ch.signal?'':' <span class="tag">nicht eingerichtet</span>'}</span>${isAdmin()&&ch.signal?'<button class="bt" data-test="signal">Test senden</button>':''}</div>`;
if(isAdmin())o+=`<form class="fm" data-form="set" style="border-top:1px solid var(--bd)"><label>Mail-Empfänger (mehrere mit Komma)<input name="mail_to" value="${esc((SET?.mail_to||[]).join(', '))}" placeholder="du@example.org"></label><label>Morgenmeldung um<input name="digest_time" type="time" value="${esc(SET?.digest_time||'07:00')}" required></label><span style="display:flex;gap:8px"><button class="pb">Speichern</button><button type="button" class="bt" data-sy="digest">Morgenmeldung jetzt senden</button></span></form>`;
else o+=`<div class="row"><span>Morgenmeldung</span><span>${esc(SET?.digest_time||'')}</span></div>`;
o+=msg('set')+msg('test')+`</div>`+puCard();
if(isAdmin()){o+=`<div class="sec">Benutzer</div><div class="card">${(USERS||[]).map(u=>`<div class="row"><span>${esc(u.email)}${u.name?` <span style="color:var(--tx3)">${esc(u.name)}</span>`:''}</span><span><select class="sm" data-role="${u.id}">${['admin','viewer'].map(r=>`<option value="${r}"${r===u.role?' selected':''}>${r==='admin'?'Admin':'Betrachter'}</option>`).join('')}</select>${u.id!==ME?.id?`<button class="bt" data-del="${u.id}">Löschen</button>`:''}</span></div>`).join('')}<form class="fm" data-form="user" style="border-top:1px solid var(--bd)"><label>E-Mail<input name="email" type="email" required></label><label>Passwort (min. 10 Zeichen, später selbst ändern)<input name="password" type="text" minlength="10" required autocomplete="off"></label><label>Rolle<select name="role"><option value="viewer">Betrachter (nur lesen)</option><option value="admin">Admin</option></select></label><button class="pb">Benutzer anlegen</button></form>${msg('user')}</div>`}
const en=SY?.engines||{};const nm={app:'App',healthchecks:'Healthchecks',beszel:'Beszel'};
o+=`<div class="sec">System</div><div class="card">${Object.entries(en).map(([k,e])=>`<div class="row"><span>${dot(e.ok)}${nm[k]||k}</span><span class="m">${esc(e.detail||'')}${e.url?` <a class="lk" style="margin:0 0 0 6px" href="${esc(e.url)}" target="_blank" rel="noopener">öffnen ↗</a>`:''}</span></div>`).join('')}<div class="row"><span>Version</span><span class="m">${esc(SY?.version||'–')}</span></div><div class="row"><span>Anmeldung</span><span class="m">${{local:'lokale Konten',access:'Cloudflare Access',none:'aus (nur Test!)'}[SY?.auth]||'–'}</span></div></div>`;
o+=`<div class="sec">Selbstüberwachung</div><div class="card"><div class="fm" style="font-size:13px;color:var(--tx2)">Fällt dieser Server ganz aus, kann er das nicht selbst melden. Ein externer Wächter (z. B. Home Assistant oder ein zweiter Healthchecks-Check von außen) sollte <code>/healthz</code> prüfen.</div></div>`;
return o}
const V={
ov(){const s=S.summary,bad=S.checks.length-s.checks_ok;let o=`<div class="k"><div class="kc" data-go="ho"><b style="color:var(--${s.hosts_up===s.hosts_total?'ok':'bad'})">${s.hosts_up}/${s.hosts_total}</b><span>Hosts</span></div><div class="kc" data-go="jo"><b style="color:var(--${bad?'bad':'ok'})">${bad}</b><span>Job${bad===1?'':'s'} rot</span></div><div class="kc" data-go="up"><b style="color:var(--${s.sec_overdue?'bad':s.upd_hosts?'warn':'ok'})">${s.upd_hosts}</b><span>Host${s.upd_hosts===1?'':'s'} mit Updates</span>${s.updates?`<span class="ks">${s.updates} Pakete</span>`:''}${s.security?`<span class="ks" style="color:var(--${s.sec_overdue?'bad':'tx2'})">${s.sec_overdue?'⚠ '+s.sec_overdue+' Security überfällig':s.security+' Security'}</span>`:''}${s.reboot_hosts?`<span class="ks">↻ ${s.reboot_hosts} Neustart</span>`:''}</div></div>`;
o+=`<div class="sec">Braucht Aufmerksamkeit</div>`;
o+=S.attention.length?`<div class="card">${S.attention.map((a,i)=>a.kind==='check'?chkItem(S.checks.find(c=>c.uuid===a.uuid)||{uuid:a.uuid,name:a.title,status:'down'}):item('a:'+i+a.title,a.level,esc(a.title),'',`<div class="log">${esc(a.detail)}</div>`)).join('')}</div>`:`<div class="card"><div class="empty">Alles grün.</div></div>`;
const run=S.checks.filter(c=>c.status==='started');if(run.length)o+=`<div class="sec">Läuft gerade</div><div class="card">${run.map(c=>chkItem(c)).join('')}</div>`;
const pbsRun=Object.entries(S.pbs).flatMap(([n,p])=>(p.running||[]).map(t=>({n,...t})));if(pbsRun.length)o+=`<div class="sec">PBS-Tasks aktiv</div><div class="card">${pbsRun.map((t,i)=>item('pr:'+i,'run',esc(t.n+' · '+t.type),esc('seit '+rel(new Date(t.start*1000).toISOString())),`<div class="log">${esc(t.id||'')}</div>`)).join('')}</div>`;
if(S.events.length)o+=`<div class="sec">Meldungen</div><div class="card">${S.events.slice(0,10).map((e,i)=>item('e:'+i+e.ts,e.prio==='kritisch'?'bad':e.prio==='normal'?'warn':'',esc(e.title),esc(rel(e.ts)),`<div class="log">${esc(e.message||'–')}</div>`)).join('')}</div>`;
o+=puCard();return o},
ho(){const pbs=Object.entries(S.pbs);let o=`<div class="sec">Hosts</div><div class="card">${S.hosts.map(hostItem).join('')||'<div class="empty">Keine Daten von Beszel.</div>'}</div>`;
if(pbs.length)o+=`<div class="sec">PBS-Datastores</div><div class="card">${pbs.map(([n,p])=>{const ds=p.datastores||[];const mx=Math.max(0,...ds.map(d=>d.total?d.used/d.total*100:0));return item('p:'+n,p.online?(mx>=90?'bad':mx>=80?'warn':'ok'):'',esc(n),esc(p.online?pct(mx):'offline · '+rel(p.checked)),ds.map(d=>{const q=d.total?d.used/d.total*100:0;return`<div class="kv"><span>${esc(d.store)}</span><span>${(d.used/1e12).toFixed(2)} / ${(d.total/1e12).toFixed(2)} TB</span></div>${bar(q)}`}).join('')+((p.running||[]).length?`<div class="sec">Aktiv</div>`+(p.running.map(t=>`<div class="kv"><span>${esc(t.type)}</span><span>seit ${esc(rel(new Date(t.start*1000).toISOString()))}</span></div>`).join('')):''))}).join('')}</div>`;
return o},
jo(){const g={};S.checks.forEach(c=>(g[c.host||'sonstige']??=[]).push(c));const order=Object.keys(g).sort();
let top='';if(isAdmin())top=JOBF?jobForm():(JDONE?jobDone():'')+`<div style="display:flex;justify-content:flex-end;margin:4px 0 8px"><button class="pb" data-job="new">+ Job anlegen</button></div>`;
return top+(order.map(h=>`<div class="sec">${esc(h)}</div><div class="card">${g[h].map(c=>chkItem(c,c.name.split('/').slice(1).join('/')||c.name)).join('')}</div>`).join('')||`<div class="empty">${isAdmin()?'Noch keine Jobs. Lege oben den ersten an – zum Beispiel dein Backup.':'Keine Jobs.'}</div>`)},
sy(){return syView()},
up(){const reg=Object.keys(S.errors||{}).filter(k=>k.startsWith('registry:'));const note=reg.length?`<div class="err">Registry-Prüfung fehlgeschlagen: ${reg.map(k=>esc(k.slice(9))).join(', ')}</div>`:'';
const hu=S.host_updates||[];
return note+(hu.length?`<div class="sec">Nach Dringlichkeit</div><div class="card">${hu.map(hupItem).join('')}</div>`:'<div class="card"><div class="empty">Keine offenen Updates.</div></div>')}};
function render(){if(!S)return;$('#title').textContent=TABS.find(t=>t[0]===tab)[1];$('#gen').textContent='Stand '+(S.generated?new Date(S.generated).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–');
const errs=Object.entries(S.errors||{}).filter(([k])=>!k.startsWith('registry:'));$('#v').innerHTML=(errs.length?`<div class="err">Quelle gestört: ${errs.map(([k,v])=>esc(k)).join(', ')}</div>`:'')+V[tab]();
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'ac':''}" data-go="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join('');
document.querySelectorAll('.op [data-log]').forEach(loadLog)}
async function loadLog(el){const id=el.dataset.log;try{const r=await fetch('/api/check/'+id+'/log');const j=await r.json();el.textContent=(j.date?new Date(j.date).toLocaleString('de-DE')+(j.duration?' · '+dur(j.duration):'')+'\n\n':'')+(j.text||'')}catch(e){el.textContent='Log nicht abrufbar.'}}
const jget=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()};
async function loadSys(){try{SY=await jget('/api/system');SET=await jget('/api/settings');if(isAdmin())USERS=(await jget('/api/users')).users}catch(e){}}
async function load(fresh){try{const r=await fetch('/api/state'+(fresh===true?'?fresh=1':''),{cache:'no-store'});if(r.status===401){location.replace('/login');return}S=await r.json();if(!ME)ME=(await jget('/api/auth/state')).user;if(isAdmin()&&!JH)await ensureJH();if(tab==='sy'||!SY)await loadSys();if(document.activeElement?.closest('form'))return;render()}catch(e){$('#gen').textContent='offline – letzter Stand';}}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||('Fehler '+r.status));return j}
async function syAct(fn,key,ok){try{await fn();MSG[key]={t:ok}}catch(e){MSG[key]={t:e.message,e:1}}await loadSys();render();setTimeout(()=>{delete MSG[key];render()},6000)}
document.addEventListener('click',e=>{const cb=e.target.closest('[data-copy]');if(cb){const l=cb.textContent;copyText(cb.dataset.copy).then(()=>{cb.textContent='Kopiert ✓'},()=>{cb.textContent='Bitte markieren und kopieren'});setTimeout(()=>{cb.textContent=l},2000);return}
const jb=e.target.closest('[data-job]');if(jb){const[a,id]=jb.dataset.job.split(':');
if(a==='new'){ensureJH().then(()=>{JOBF={mode:'new',v:{tpl:'backup',...JT.backup}};JDONE=null;delete MSG.job;render();scrollTo(0,0)});return}
if(a==='cancel'){JOBF=null;delete MSG.job;render();return}
if(a==='done'){JDONE=null;render();return}
if(a==='edit'){ensureJH().then(()=>api('GET','/api/checks/'+id)).then(v=>{JOBF={mode:'edit',uuid:id,v};JDONE=null;delete MSG.job;tab='jo';render();scrollTo(0,0)},er=>alert(er.message));return}
if(a==='del'){const c=S.checks.find(x=>x.uuid===id);if(confirm(`Job „${c?.name||id}“ löschen? Der Verlauf in Healthchecks geht dabei verloren.`))api('DELETE','/api/checks/'+id).then(()=>load(),er=>alert(er.message));return}}
const pb=e.target.closest('[data-pu]');if(pb){puAct(pb.dataset.pu);return}
const sy=e.target.closest('[data-sy]');if(sy){const a=sy.dataset.sy;
if(a==='logout'){api('POST','/api/auth/logout').finally(async()=>{try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.replace('/login')});return}
if(a==='cmd'){Promise.all([api('GET','/api/hosts/install-command'),api('GET','/api/agent')]).then(([j,g])=>{CMD=j.command;AG=g;render()},e=>{MSG.cmd={t:e.message,e:1};render()});return}
if(a==='digest'){syAct(()=>api('POST','/api/digest/test'),'set','Morgenmeldung gesendet.');return}}
const ts=e.target.closest('[data-test]');if(ts){syAct(()=>api('POST','/api/notify/test',{channel:ts.dataset.test}),'test','Test gesendet – bitte Posteingang prüfen.');return}
const dl=e.target.closest('[data-del]');if(dl){if(confirm('Benutzer löschen?'))syAct(()=>api('DELETE','/api/users/'+dl.dataset.del),'user','Gelöscht.');return}
const ck=e.target.closest('[data-ck]');if(ck){const[a,id]=ck.dataset.ck.split(':');api('POST',`/api/checks/${id}/${a}`).then(load,er=>alert(er.message));return}const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;localStorage.setItem('tab',tab);render();scrollTo(0,0);return}
const h=e.target.closest('.hd');if(h){const it=h.parentElement,id=it.dataset.id;it.classList.toggle('op');it.classList.contains('op')?open.add(id):open.delete(id);const l=it.querySelector('[data-log]');if(l&&it.classList.contains('op'))loadLog(l)}});
{const qs=new URLSearchParams(location.search),q=qs.get('c'),t=qs.get('t');if(q){tab='jo';open.add('c:'+q)}if(t&&TABS.some(x=>x[0]===t))tab=t;if(q||t)history.replaceState(null,'','/')}
document.addEventListener('change',e=>{const jf=e.target.closest('[data-jf]');if(jf&&JOBF){const n=jf.name,v={...JOBF.v,...jobVals()};if(n==='tpl')Object.assign(v,JT[v.tpl],{host:v.host,job:v.job});if(n==='src'&&(v.src==='pve'||v.src==='pbs'))v.ev=v.src==='pve'?'vzdump':'verify';if(['tpl','mode','src'].includes(n)){JOBF.v=v;render()}else JOBF.v=v;return}
const pr=e.target.closest('[data-prio]');if(pr){api('POST',`/api/checks/${pr.dataset.prio}/prio`,{prio:pr.value}).then(load,er=>alert(er.message));return}
const ro=e.target.closest('[data-role]');if(ro)syAct(()=>api('PATCH','/api/users/'+ro.dataset.role,{role:ro.value}),'user','Rolle geändert.')});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));const k=f.dataset.form;
if(k==='job'){const ed=JOBF?.mode==='edit';JOBF.v={...JOBF.v,...d};(ed?api('PUT','/api/checks/'+JOBF.uuid,d):api('POST','/api/checks',d)).then(r=>{if(!ed)JDONE=r.form;JOBF=null;delete MSG.job;render();load();scrollTo(0,0)},er=>{MSG.job={t:er.message,e:1};render()});return}
if(k==='pw')syAct(()=>api('POST','/api/auth/password',d),'pw','Passwort geändert.');
if(k==='set')syAct(()=>api('PUT','/api/settings',d),'set','Gespeichert.');
if(k==='user')syAct(()=>api('POST','/api/users',d),'user','Benutzer angelegt.')});
$('#reload').onclick=()=>load(true);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(load,30000);load();
// ---- Mitteilungen (Web Push)
let PU=null;const u8=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const jpost=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
function puCard(){const t={na:'Nur in der installierten App: Teilen → „Zum Home-Bildschirm“, dann von dort öffnen.',denied:'Blockiert – in iOS unter Einstellungen → Mitteilungen → Status erlauben.',off:'Aus auf diesem Gerät',on:'Aktiv auf diesem Gerät'}[PU]||'…';
const b=PU==='off'?'<button class="bt" data-pu="on">Aktivieren</button>':PU==='on'?'<button class="bt" data-pu="test">Test</button><button class="bt" data-pu="off">Aus</button>':'';
return`<div class="sec">Mitteilungen</div><div class="card"><div class="kv" style="padding:11px 12px;align-items:center;gap:8px"><span>${esc(t)}</span><span style="white-space:nowrap">${b}</span></div></div>`}
async function puInit(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){PU='na';return render()}
try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();PU=Notification.permission==='denied'?'denied':sub?'on':'off';if(sub)jpost('/api/push/subscribe',sub.toJSON())}catch(e){PU='na'}render()}
async function puAct(a){try{if(a==='on'){const p=await Notification.requestPermission();if(p!=='granted'){PU=p==='denied'?'denied':'off';return render()}
const reg=await navigator.serviceWorker.ready;const r0=await fetch('/api/push/key');if(!r0.ok)throw new Error('Server ohne Schlüssel');const k=(await r0.json()).key;
const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(k)});const r=await jpost('/api/push/subscribe',sub.toJSON());if(!r.ok)throw new Error('Registrierung '+r.status);PU='on'}
else if(a==='off'){const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await jpost('/api/push/unsubscribe',{endpoint:sub.endpoint});await sub.unsubscribe()}PU='off'}
else if(a==='test'){const j=await (await jpost('/api/push/test')).json();$('#gen').textContent=`Test an ${j.sent}/${j.devices} Gerät(e)`;return}
render()}catch(e){$('#gen').textContent='Mitteilungen: '+e.message}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').then(puInit,()=>{PU='na';render()});else PU='na';
</script>
