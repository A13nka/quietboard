<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QuietBoard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
[hidden]{display:none!important}
:root{--bg:#f6f6f4;--card:#fff;--tx:#1d1d1b;--tx2:#6b6b66;--tx3:#9a9a94;--bd:#e3e2dc;--ok:#3b8a2e;--bad:#c93a3a;--warn:#c98a12;--acc:#2f6fd0;--chip:#efeee9;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--tx:#e9e9e6;--tx2:#a5a7ab;--tx3:#73767c;--bd:#2c313a;--chip:#252a33;--ok:#5cb84a;--bad:#e05757;--warn:#e0a735;--acc:#6aa0f0}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
/* iOS (Home-Bildschirm-App): Seite nie kürzer als der Bildschirm, sonst verrutscht die feste Leiste unten nach einem Tab-Wechsel */
body{min-height:100vh;min-height:100dvh}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;font-weight:600;margin:0}header small{color:var(--tx3);font-size:12px}
header button{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:8px;padding:4px 10px;font-size:13px}
main{padding:0 14px calc(env(safe-area-inset-bottom) + 84px);max-width:640px;margin:0 auto}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.kc b{display:block;font-size:22px;font-weight:600}.kc span{font-size:12px;color:var(--tx2)}
.kc .ks{display:block;font-size:11px;margin-top:2px}
.sec{font-size:12px;color:var(--tx2);margin:18px 2px 6px;text-transform:none;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.it+.it{border-top:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--tx3)}
.d.ok{background:var(--ok)}.d.bad{background:var(--bad)}.d.warn{background:var(--warn)}.d.run{background:var(--acc)}
.n{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{flex:0 1000000 auto;min-width:0;display:flex;overflow:hidden;white-space:nowrap;margin-left:-4px}
.m{flex:0 1000 auto;min-width:min-content;margin-left:auto;color:var(--tx2);font-size:13px;text-align:right;line-height:1.35}
.cv{color:var(--tx3);transition:transform .15s;font-size:12px}.op .cv{transform:rotate(180deg)}
.bd{display:none;padding:0 12px 12px 31px}.op .bd{display:block}
.log{background:var(--chip);border-radius:8px;padding:8px 10px;font:12px/1.5 var(--mono);color:var(--tx2);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);padding:2px 0}
.tr{height:5px;background:var(--chip);border-radius:3px;margin:2px 0 6px}.tr i{display:block;height:5px;border-radius:3px}
.bt{background:none;border:1px solid var(--bd);color:var(--acc);border-radius:8px;padding:4px 10px;font-size:13px;margin-left:6px}
.lk{display:inline-block;margin-top:6px;margin-right:14px;font-size:13px;color:var(--acc);text-decoration:none}
.err{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.empty{color:var(--tx2);font-size:14px;padding:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--tx2);margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--tx3);font-size:11px;padding:4px 0}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav button.ac{color:var(--acc)}
.fm{display:grid;gap:8px;padding:12px}.fm label{display:grid;gap:3px;font-size:12px;color:var(--tx2)}
.fm input,.fm select,select.sm{font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
select.sm{width:auto;padding:3px 6px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px}.row+.row{border-top:1px solid var(--bd)}
.pb{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:8px;padding:8px 12px}
.msg{font-size:13px;color:var(--tx2);padding:0 12px 10px}.msg.e{color:var(--bad)}
.cmd{display:block;background:var(--chip);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);word-break:break-all;user-select:all}
</style>
</head>
<body>
<header><div><h1 id="title">Übersicht</h1><small id="gen">lädt …</small></div><button id="reload" aria-label="Neu laden">↻</button></header>
<main id="v"><div class="empty">Lade Status …</div></main>
<nav id="nav"></nav>
<script src="/static/i18n.js"></script>
<script>
const LANGS={de:'Deutsch',en:'English'};
let LANG=(()=>{try{const l=localStorage.getItem('lang');if(l&&LANGS[l])return l}catch(e){}return(navigator.language||'en').toLowerCase().startsWith('de')?'de':'en'})();
document.documentElement.lang=LANG;
const LOC=()=>LANG==='de'?'de-DE':'en-GB';
function t(s,v){let r=LANG==='en'&&window.I18N_EN&&I18N_EN[s]!=null?I18N_EN[s]:s;if(v)for(const k in v)r=r.split('{'+k+'}').join(v[k]);return r}
const ICON={ov:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',ho:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',jo:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',up:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',sy:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
const TABS=[['ov','Übersicht'],['ho','Hosts'],['jo','Jobs'],['up','Updates'],['sy','System']];
let ME=null,SY=null,SET=null,USERS=null,CMD=null,CMDX=null,AG=null,HT=null,MSG={};const isAdmin=()=>ME&&ME.role==='admin';
let S=null,tab=localStorage.getItem('tab')||'ov';const open=new Set();
const $=s=>document.querySelector(s);
$('#gen').textContent=t('lädt …');$('#reload').setAttribute('aria-label',t('Neu laden'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'–':Math.round(v)+' %';
const bar=p=>`<div class="tr"><i style="width:${Math.min(p||0,100)}%;background:var(--${p>=90?'bad':p>=80?'warn':'ok'})"></i></div>`;
function rel(iso){if(!iso)return t('nie');const s=(Date.now()-new Date(iso))/1000;if(s<90)return t('gerade');if(s<3600)return Math.round(s/60)+' min';if(s<86400){const d=new Date(iso);return d.toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'})}return t('{n} Tg.',{n:Math.round(s/86400)})}
function dur(sec){if(sec==null)return'';sec=Math.round(sec);return sec<60?sec+' s':sec<3600?Math.round(sec/60)+' min':(sec/3600).toFixed(1)+' h'}
const CS={up:'ok',new:'',paused:'',grace:'warn',down:'bad',started:'run'};
const PRIO=p=>t(p);
function chkMeta(c){if(c.status==='started')return c.last_ping?t('läuft seit {t}',{t:rel(c.last_ping)}):t('läuft');if(c.status==='down')return t('fehlt/fehler');if(c.status==='grace')return t('überfällig');if(c.status==='new')return t('neu');if(c.status==='paused')return t('pausiert');return rel(c.last_ping)+(c.last_duration?' · '+dur(c.last_duration):'')}
function item(id,dot,name,meta,body){const ti=name.indexOf('<span class="tag">'),nm=ti<0?name:name.slice(0,ti),tg=ti<0?'':name.slice(ti);return`<div class="it${open.has(id)?' op':''}" data-id="${esc(id)}"><div class="hd"><span class="d ${dot}"></span><span class="n">${nm}</span>${tg?`<span class="tg">${tg}</span>`:''}<span class="m">${meta}</span><span class="cv">▾</span></div><div class="bd">${body}</div></div>`}
function chkAdmin(c){if(!isAdmin()||!c.uuid)return'';return`<div class="kv" style="margin-top:8px;align-items:center"><span>${t('Priorität')} <select class="sm" data-prio="${esc(c.uuid)}">${['kritisch','normal','info'].map(p=>`<option value="${p}"${p===c.prio?' selected':''}>${esc(PRIO(p))}</option>`).join('')}</select></span><span>${c.status==='paused'?`<button class="bt" data-ck="resume:${esc(c.uuid)}">${t('Fortsetzen')}</button>`:`<button class="bt" data-ck="pause:${esc(c.uuid)}">${t('Pausieren')}</button>`}<button class="bt" data-job="edit:${esc(c.uuid)}">${t('Bearbeiten')}</button><button class="bt" data-job="del:${esc(c.uuid)}">${t('Löschen')}</button></span></div>`}
function chkItem(c,label){return item('c:'+c.uuid,CS[c.status]||'',esc(label??c.name)+(c.prio&&c.prio!=='normal'?`<span class="tag">${esc(PRIO(c.prio))}</span>`:''),esc(chkMeta(c)),`<div class="log" data-log="${esc(c.uuid)}">${t('Lade Log …')}</div>${chkAdmin(c)}${chkGuide(c)}<a class="lk" href="${esc(S.links.hc)}" target="_blank" rel="noopener">${t('Verlauf in Healthchecks')} ↗</a>`)}
// ---- Jobs in der Oberfläche anlegen, bearbeiten, löschen; Anleitungen je Meldeweg
let JOBF=null,JH=null,JDONE=null;
const JT={backup:{label:'Backup-Skript (restic, borg, rsync …)',src:'hc',typ:'backup',mode:'cron',schedule:'0 3 * * *',grace:'2h',prio:'kritisch'},
hc:{label:'Skript oder Cronjob auf einem Host',src:'hc',typ:'skript',mode:'cron',schedule:'0 4 * * *',grace:'1h',prio:'normal'},
cert:{label:'Zertifikat erneuern (certbot, acme.sh …)',src:'hc',typ:'zertifikat',mode:'period',period:'1d',grace:'6h',prio:'normal'},
pve:{label:'Proxmox VE: Backup-Job (vzdump)',src:'pve',typ:'backup',ev:'vzdump',mode:'cron',schedule:'0 1 * * *',grace:'3h',prio:'kritisch'},
pbs:{label:'Proxmox Backup Server: Verify, GC, Prune, Sync',src:'pbs',typ:'verify',ev:'verify',mode:'cron',schedule:'0 5 * * *',grace:'3h',prio:'normal'},
url:{label:'Andere Software mit Ping-URL (Backrest …)',src:'url',typ:'backup',mode:'cron',schedule:'0 2 * * *',grace:'2h',prio:'normal'}};
const SRC={hc:'Helfer hc auf dem Host',url:'Ping-URL (andere Software)',pve:'Proxmox VE (Webhook)',pbs:'Proxmox Backup Server (Webhook)'};
function copyText(s){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(s);return new Promise((ok,no)=>{const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:-1000px;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();r?ok():no()})}
const cp=(s,label)=>`<code class="cmd">${esc(s)}</code><span><button type="button" class="bt" style="margin:0" data-copy="${esc(s)}">${label||t('Kopieren')}</button></span>`;
const hint=s=>`<span style="font-size:12px;color:var(--tx3)">${s}</span>`;
function guide(f){const sl=f.slug,src=f.src||'hc';let o='';
if(src==='hc'){const cr=(f.mode!=='period'&&f.schedule)||'0 3 * * *';
o+=hint(t('Auf <b>{host}</b> den Befehl vor das eigentliche Skript setzen. <code>hc</code> meldet Start, Ende, Exitcode und die letzten Zeilen der Ausgabe – es ist auf jedem Host installiert, der über „Host hinzufügen“ angebunden wurde.',{host:esc(f.host||t('dem Host'))}))+cp(`hc run ${sl} -- /pfad/zum/skript.sh`);
o+=hint(t('Als Cronjob, z. B. in <code>/etc/cron.d/quietboard</code>:'))+cp(`${cr} root /usr/local/bin/hc run ${sl} -- /pfad/zum/skript.sh`);
o+=hint(t('Oder in einem systemd-Service:'))+cp(`ExecStart=/usr/local/bin/hc run ${sl} -- /pfad/zum/skript.sh`)}
else if(src==='url'){const u=(JH?.ping_url||'<ping-url>')+'/'+sl;
o+=hint(t('Diese Adresse am Ende eines erfolgreichen Laufs aufrufen. <code>/start</code> angehängt meldet den Start, <code>/fail</code> einen Fehler. In Backrest: Plan → Hooks → Healthchecks, diese URL eintragen.'))+cp(u,t('Adresse kopieren'));
o+=hint(t('Aus einem Skript:'))+cp(`curl -fsS -m 10 --retry 3 ${u} >/dev/null`)}
else{const pbs=src==='pbs',url=`${JH?.webhook||'<server>/api/ingest/pve'}?source=${src}&host=${f.host}`;
o+=hint(t('Einmal pro {sys} einrichten – weitere Jobs auf demselben Host brauchen nur einen Eintrag hier.',{sys:pbs?'Proxmox Backup Server':'Proxmox VE'})+`<br>1. ${pbs?'Configuration':'Datacenter'} → Notifications → Notification Targets → Add → <b>Webhook</b>, Name <code>quietboard</code>, Method <code>POST</code>, URL:`)+cp(url);
o+=hint(t('2. Header <code>Content-Type</code> = <code>application/json</code> und <code>Authorization</code> = <code>Bearer {{ secrets.token }}</code>. Unter Secrets einen Eintrag <code>token</code> mit diesem Wert:'))+cp(JH?.token||'<INGEST_TOKEN>',t('Token kopieren'));
o+=hint('3. Body:')+cp('{"severity":"{{ severity }}","title":{{ json title }},"message":{{ json message }},"fields":{{ json fields }}}');
o+=hint(`4. Notification Matchers → Add → Target <code>quietboard</code>. ${pbs?t('Im Datastore unter Options → Notification „Notification System“ wählen.'):t('Im Backup-Job bei Notification „Notification system“ wählen.')}<br>5. ${t('Mit „Test“ prüfen: Unter Übersicht → Meldungen erscheint ein Eintrag. Ein erfolgreicher Lauf meldet diesen Job grün, ein Fehler rot.')}`)}
return `<div class="fm" style="padding:8px 0 0">${o}</div>`}
function chkGuide(c){if(!isAdmin()||!c.slug)return'';const f={slug:c.slug,src:c.src||'hc',host:c.host,ev:(c.match?.type||[]).join(',')};return`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--acc);font-size:13px">${t('So meldet sich dieser Job')}</summary>${guide(f)}</details>`}
function jobForm(){const v=JOBF.v,ed=JOBF.mode==='edit',sel=(n,opts,cur)=>`<select name="${n}" data-jf>${opts.map(([k,l])=>`<option value="${esc(k)}"${k===cur?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
const px=v.src==='pve'||v.src==='pbs';let o=`<form class="fm" data-form="job">`;
if(!ed)o+=`<label>${t('Was soll überwacht werden?')}${sel('tpl',Object.entries(JT).map(([k,x])=>[k,t(x.label)]),v.tpl)}</label>`;
o+=`<label>${px?t('Proxmox-Host (Name wie in der Webhook-Adresse)'):'Host'}<input name="host" list="jhosts" value="${esc(v.host||'')}" ${ed?'readonly':'required'} placeholder="${t('z. B.')} docker01" autocapitalize="off"></label><datalist id="jhosts">${(JH?.hosts||[]).map(h=>`<option value="${esc(h)}">`).join('')}</datalist>`;
o+=`<label>${t('Name des Jobs')}<input name="job" value="${esc(v.job||'')}" ${ed?'readonly':'required'} placeholder="${t('z. B.')} restic-offsite" autocapitalize="off"></label>`;
o+=`<label>${t('Wann läuft er?')}${sel('mode',[['cron',t('zu festen Zeiten (Cron)')],['period',t('regelmäßig alle …')]],v.mode)}</label>`;
o+=v.mode==='period'?`<label>${t('Intervall')}<input name="period" value="${esc(v.period||'1d')}" placeholder="1d"></label>${hint(t('z. B. 30m, 12h, 1d, 7d'))}`:`<label>${t('Zeitplan (Cron)')}<input name="schedule" value="${esc(v.schedule||'')}" placeholder="0 3 * * *"></label>${hint(t('Minute Stunde Tag Monat Wochentag · <code>0 3 * * *</code> täglich 3:00 · <code>30 2 * * 0</code> sonntags 2:30 · Zeitzone {tz}',{tz:esc(v.tz||JH?.tz||'')}))}<input type="hidden" name="tz" value="${esc(v.tz||JH?.tz||'')}">`;
o+=`<label>${t('Darf dauern bzw. sich verspäten, bevor es Alarm gibt')}<input name="grace" value="${esc(v.grace||'1h')}" placeholder="2h"></label>`;
o+=`<label>${t('Priorität')}${sel('prio',[['kritisch',t('kritisch – sofort melden')],['normal',t('normal – melden')],['info',t('info – nur anzeigen')]],v.prio)}</label>`;
o+=`<label>${t('Art')}${sel('typ',(JH?.types||['backup','skript']).map(x=>[x,t(x)]),v.typ)}</label>`;
o+=`<label>${t('Wie meldet er sich?')}${sel('src',Object.entries(SRC).map(([k,l])=>[k,t(l)]),v.src)}</label>`;
if(px)o+=`<label>${t('Ereignis')}${sel('ev',(v.src==='pve'?[['vzdump','vzdump (Backup)'],['replication','replication']]:[['verify','verify'],['gc','gc (Garbage Collection)'],['prune','prune'],['sync','sync']]).concat(v.ev&&!['vzdump','replication','verify','gc','prune','sync'].includes(v.ev)?[[v.ev,v.ev]]:[]),v.ev)}</label><label>${t('Nur Job-ID (optional)')}<input name="job_id" value="${esc(v.job_id||'')}" placeholder="${t('z. B.')} backup-1a2b3c"></label>${v.src==='pbs'?`<label>${t('Nur Datastore (optional)')}<input name="ds" value="${esc(v.ds||'')}" placeholder="${t('z. B.')} store1"></label>`:''}`;
o+=`<label>${t('Notiz (optional)')}<input name="desc" value="${esc(v.desc||'')}"></label>`;
o+=`<span style="display:flex;gap:8px"><button class="pb">${ed?t('Speichern'):t('Job anlegen')}</button><button type="button" class="bt" data-job="cancel">${t('Abbrechen')}</button></span></form>${msg('job')}`;
return `<div class="sec">${ed?t('Job bearbeiten: {n}',{n:esc(v.host+'/'+v.job)}):t('Neuer Job')}</div><div class="card">${o}</div>`}
function jobDone(){const f=JDONE;return`<div class="sec">${t('Angelegt: {n}',{n:esc(f.host+'/'+f.job)})}</div><div class="card"><div class="fm">${hint(t('Der Job steht jetzt auf „neu“ und wird grün, sobald er sich das erste Mal meldet. So meldet er sich:'))}${guide(f)}<span><button type="button" class="bt" style="margin:0" data-job="done">${t('Fertig')}</button></span></div></div>`}
async function ensureJH(){if(!JH&&isAdmin()){try{JH=await jget('/api/jobs/help')}catch(e){}}}
function jobVals(){const f=document.querySelector('[data-form="job"]');return f?Object.fromEntries(new FormData(f)):{}}
// ---- Host-Einstellungen, API-Tokens, Konfiguration (YAML)
let TOK=null,NEWTOK=null,IMP=null;
const TA='font:13px var(--mono);color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px';
function hostAdmin(h){if(!isAdmin())return'';const links=(h.links||[]).map(l=>`${l.label} = ${l.url}`).join('\n');
return`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--acc);font-size:13px">${t('Einstellungen')}</summary><form class="fm" style="padding:8px 0 0" data-form="host" data-host="${esc(h.name)}"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="always_on" style="width:auto"${h.always_on?' checked':''}>${t('Läuft dauerhaft')}</label>${hint(t('Ausgeschaltet: Der Host ist nur zeitweise an (z. B. ein NAS, das nachts läuft) und gilt dann nicht als ausgefallen.'))}<label>${t('Weblinks (eine Zeile pro Link: Name = Adresse)')}<textarea name="links" rows="3" style="${TA}" placeholder="Portainer = https://docker01.home.arpa:9443">${esc(links)}</textarea></label><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="pb">${t('Speichern')}</button><button type="button" class="bt" style="margin:0" data-hdel="${esc(h.name)}">${t('Host entfernen')}</button></span>${msg('host:'+h.name)}</form></details>`}
function tokCard(){if(!TOK?.available)return'';let o=`<div class="sec">API-Tokens</div><div class="card">`;
if(NEWTOK)o+=`<div class="fm">${hint(t('Neuer Token – nur jetzt sichtbar. Sicher ablegen (z. B. Passwortmanager):'))}${cp(NEWTOK,t('Token kopieren'))}${hint(t('Benutzen: <code>curl -H "Authorization: Bearer &lt;token&gt;" http://&lt;server&gt;:8088/api/state</code> – gleiche Rechte wie dein Konto.'))}<span><button type="button" class="bt" style="margin:0" data-tok="done">${t('Fertig')}</button></span></div>`;

async function loadLog(el){const id=el.dataset.log;try{const r=await fetch('/api/check/'+id+'/log');const j=await r.json();el.textContent=(j.date?new Date(j.date).toLocaleString(LOC())+(j.duration?' · '+dur(j.duration):'')+'\n\n':'')+(j.text?t(j.text):'')}catch(e){el.textContent=t('Log nicht abrufbar.')}}
const jget=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()};
async function loadSys(){try{SY=await jget('/api/system');SET=await jget('/api/settings');if(isAdmin()){USERS=(await jget('/api/users')).users;HT=await jget('/api/host-tokens')}TOK=await jget('/api/tokens')}catch(e){}}
async function load(fresh){try{const r=await fetch('/api/state'+(fresh===true?'?fresh=1':''),{cache:'no-store'});if(r.status===401){location.replace('/login');return}if(!r.ok)throw new Error(r.status);OFF=r.headers.get('X-QB-Offline')==='1';S=await r.json();if(!ME)ME=(await jget('/api/auth/state')).user;if(isAdmin()&&!JH)await ensureJH();if(tab==='sy'||!SY)await loadSys();if(document.activeElement?.closest('form'))return;render()}catch(e){$('#gen').textContent=t('offline – letzter Stand');}}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg?t(j.msg,j.args):t(j.detail||t('Fehler {n}',{n:r.status})));return j}
async function syAct(fn,key,ok){try{await fn();MSG[key]={t:ok}}catch(e){MSG[key]={t:e.message,e:1}}await loadSys();render();setTimeout(()=>{delete MSG[key];render()},6000)}

const hd=e.target.closest('[data-hdel]');if(hd){const n=hd.dataset.hdel;if(confirm(t('Host „{n}“ entfernen?\n\nVorher auf dem Host den Agent deinstallieren (Doku: Sicherung, Umzug, Deinstallation) – sonst meldet er sich gleich wieder an. Verlauf und Update-Berichte dieses Hosts werden gelöscht.',{n})))api('DELETE','/api/hosts/'+encodeURIComponent(n)).then(()=>load(),er=>alert(er.message));return}
const jb=e.target.closest('[data-job]');if(jb){const[a,id]=jb.dataset.job.split(':');
if(a==='new'){ensureJH().then(()=>{JOBF={mode:'new',v:{tpl:'backup',...JT.backup}};JDONE=null;delete MSG.job;render();scrollTo(0,0)});return}
if(a==='cancel'){JOBF=null;delete MSG.job;render();return}
if(a==='done'){JDONE=null;render();return}
if(a==='edit'){ensureJH().then(()=>api('GET','/api/checks/'+id)).then(v=>{JOBF={mode:'edit',uuid:id,v};JDONE=null;delete MSG.job;tab='jo';render();scrollTo(0,0)},er=>alert(er.message));return}
if(a==='del'){const c=S.checks.find(x=>x.uuid===id);if(confirm(t('Job „{n}“ löschen? Der Verlauf in Healthchecks geht dabei verloren.',{n:c?.name||id})))api('DELETE','/api/checks/'+id).then(()=>load(),er=>alert(er.message));return}}
const pb=e.target.closest('[data-pu]');if(pb){puAct(pb.dataset.pu);return}
const sy=e.target.closest('[data-sy]');if(sy){const a=sy.dataset.sy;
if(a==='logout'){(async()=>{try{const r=await navigator.serviceWorker?.getRegistration();const sub=await r?.pushManager?.getSubscription();if(sub){await api('POST','/api/push/unsubscribe',{endpoint:sub.endpoint});await sub.unsubscribe()}}catch(e){}})().finally(()=>api('POST','/api/auth/logout')).finally(async()=>{try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.replace('/login')});return}
if(a==='htdel'){if(!confirm(t('Token von {h} widerrufen? Der Host meldet danach nichts mehr, bis er ein neues hat.',{h:sy.dataset.h})))return;api('DELETE','/api/host-tokens/'+encodeURIComponent(sy.dataset.h)).then(async()=>{HT=await jget('/api/host-tokens');render()},er=>{MSG.ht={t:er.message,e:1};render()});return}
if(a==='legacy'){const on=sy.checked;if(!on&&!confirm(t('Gemeinsames Token abschalten? Hosts und Webhooks, die es noch nutzen, werden dann abgewiesen.'))){sy.checked=true;return}api('PUT','/api/settings',{legacy_ingest_token:on}).then(async()=>{HT=await jget('/api/host-tokens');CMD=null;MSG.ht={t:t('Gespeichert.')};render()},er=>{MSG.ht={t:er.message,e:1};render()});return}
if(a==='cmd'){Promise.all([api('GET','/api/hosts/install-command'),api('GET','/api/agent')]).then(([j,g])=>{CMD=j.command;CMDX=j.expires;AG=g;render()},er=>{MSG.cmd={t:er.message,e:1};render()});return}
if(a==='digest'){syAct(()=>api('POST','/api/digest/test'),'set',t('Morgenmeldung gesendet.'));return}}
const ts=e.target.closest('[data-test]');if(ts){syAct(()=>api('POST','/api/notify/test',{channel:ts.dataset.test}),'test',t('Test gesendet – bitte Posteingang prüfen.'));return}
const dl=e.target.closest('[data-del]');if(dl){if(confirm(t('Benutzer löschen?')))syAct(()=>api('DELETE','/api/users/'+dl.dataset.del),'user',t('Gelöscht.'));return}
const ck=e.target.closest('[data-ck]');if(ck){const[a,id]=ck.dataset.ck.split(':');api('POST',`/api/checks/${id}/${a}`).then(load,er=>alert(er.message));return}const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;localStorage.setItem('tab',tab);render();scrollTo(0,0);return}
const h=e.target.closest('.hd');if(h){const it=h.parentElement,id=it.dataset.id;it.classList.toggle('op');it.classList.contains('op')?open.add(id):open.delete(id);const l=it.querySelector('[data-log]');if(l&&it.classList.contains('op'))loadLog(l)}});
{const qs=new URLSearchParams(location.search),q=qs.get('c'),tt=qs.get('t');if(q){tab='jo';open.add('c:'+q)}if(tt&&TABS.some(x=>x[0]===tt))tab=tt;if(q||tt)history.replaceState(null,'','/')}
document.addEventListener('change',e=>{const lg=e.target.closest('[data-lang]');if(lg){try{lg.value?localStorage.setItem('lang',lg.value):localStorage.removeItem('lang')}catch(er){}location.reload();return}
const fi=e.target.closest('[data-impfile]');if(fi&&fi.files[0]){fi.files[0].text().then(x=>{IMP={yaml:x};render()});return}
const jf=e.target.closest('[data-jf]');if(jf&&JOBF){const n=jf.name,v={...JOBF.v,...jobVals()};if(n==='tpl')Object.assign(v,JT[v.tpl],{host:v.host,job:v.job});if(n==='src'&&(v.src==='pve'||v.src==='pbs'))v.ev=v.src==='pve'?'vzdump':'verify';if(['tpl','mode','src'].includes(n)){JOBF.v=v;render()}else JOBF.v=v;return}
const pr=e.target.closest('[data-prio]');if(pr){api('POST',`/api/checks/${pr.dataset.prio}/prio`,{prio:pr.value}).then(load,er=>alert(er.message));return}
const ro=e.target.closest('[data-role]');if(ro)syAct(()=>api('PATCH','/api/users/'+ro.dataset.role,{role:ro.value}),'user',t('Rolle geändert.'))});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();DIRTY.delete(fkey(f));const d=Object.fromEntries(new FormData(f));const k=f.dataset.form;
if(k==='host'){const links=(d.links||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('=');return i<0?{label:'',url:l}:{label:l.slice(0,i).trim(),url:l.slice(i+1).trim()}});const n=f.dataset.host;api('PUT','/api/hosts/'+encodeURIComponent(n)+'/settings',{always_on:!!d.always_on,links}).then(()=>{MSG['host:'+n]={t:t('Gespeichert.')};render();load()},er=>{MSG['host:'+n]={t:er.message,e:1};render()});return}
if(k==='tok'){api('POST','/api/tokens',d).then(async r=>{NEWTOK=r.token;await loadSys();render()},er=>{MSG.tok={t:er.message,e:1};render()});return}
if(k==='imp'){const dry=(e.submitter?.value||'dry')!=='apply';IMP={yaml:d.yaml};api('POST','/api/config/import',{yaml:d.yaml,dry}).then(r=>{IMP={yaml:d.yaml,res:r};delete MSG.imp;render();if(!dry)load()},er=>{MSG.imp={t:er.message,e:1};render()});return}
if(k==='job'){const ed=JOBF?.mode==='edit';JOBF.v={...JOBF.v,...d};(ed?api('PUT','/api/checks/'+JOBF.uuid,d):api('POST','/api/checks',d)).then(r=>{if(!ed)JDONE=r.form;JOBF=null;delete MSG.job;render();load();scrollTo(0,0)},er=>{MSG.job={t:er.message,e:1};render()});return}
if(k==='pw')syAct(()=>api('POST','/api/auth/password',d),'pw',t('Passwort geändert.'));
if(k==='set')syAct(()=>api('PUT','/api/settings',d),'set',t('Gespeichert.'));
if(k==='alerts'){const app=d.job_alerts==='app',was=(SET?.job_alerts||'hc')==='app',c=!!d.chan&&app!==was;if(c&&app&&!confirm(t('Integrationen von allen Jobs lösen? Die Zuordnung wird gesichert und lässt sich wiederherstellen.')))return;syAct(()=>api('PUT','/api/settings',{job_alerts:d.job_alerts,detach_hc_channels:app&&c,restore_hc_channels:!app&&c}),'alerts',t('Gespeichert.'))}
if(k==='user')syAct(()=>api('POST','/api/users',d),'user',t('Benutzer angelegt.'))});
$('#reload').onclick=()=>load(true);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(load,30000);load();
// ---- Mitteilungen (Web Push)
let PU=null;const u8=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const jpost=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
// Wer meldet Job-Ausfälle (QuietBoard oder Healthchecks) + Lebenszeichen quietboard/app
function alCard(){const m=SET?.job_alerts||'hc',hb=SY?.heartbeat;
let o=`<div class="sec">${t('Job-Alarme')}</div><div class="card">`;
o+=`<div class="row"><span>${t('Absender')}</span><span>${m==='app'?t('QuietBoard (Push, Mail, Signal)'):t('Healthchecks (dessen Integrationen)')}</span></div>`;
o+=`<div class="row"><span>${dot(hb&&hb.status==='up')}${t('Lebenszeichen')} <code>quietboard/app</code></span><span>${hb?esc(t(hb.status||'neu')):t('noch nicht angelegt')}</span></div>`;
if(isAdmin())o+=`<form class="fm" data-form="alerts" style="border-top:1px solid var(--bd)"><label>${t('Job-Alarme senden über')}<select name="job_alerts"><option value="app"${m==='app'?' selected':''}>${t('QuietBoard – einheitliche Meldungen über alle Kanäle oben')}</option><option value="hc"${m==='hc'?' selected':''}>${t('Healthchecks – dessen Integrationen je Job')}</option></select></label><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="chan" style="width:auto">${m==='app'?t('Integrationen wieder den Jobs zuordnen (aus der Sicherung)'):t('Integrationen von den Jobs lösen (sonst kommt alles doppelt; wird gesichert)')}</label>${hint(t('Das Lebenszeichen behält immer die Integrationen von Healthchecks: Fällt QuietBoard aus, meldet Healthchecks.'))}<span><button class="pb">${t('Speichern')}</button></span></form>`;
return o+msg('alerts')+`</div>`}
function puCard(){const x={na:t('Nur in der installierten App: Teilen → „Zum Home-Bildschirm“, dann von dort öffnen.'),denied:t('Blockiert – in iOS unter Einstellungen → Mitteilungen → Status erlauben.'),off:t('Aus auf diesem Gerät'),on:t('Aktiv auf diesem Gerät')}[PU]||'…';
const b=PU==='off'?`<button class="bt" data-pu="on">${t('Aktivieren')}</button>`:PU==='on'?`${isAdmin()?'<button class="bt" data-pu="test">Test</button>':''}<button class="bt" data-pu="off">${t('Aus')}</button>`:'';
return`<div class="sec">${t('Mitteilungen')}</div><div class="card"><div class="kv" style="padding:11px 12px;align-items:center;gap:8px"><span>${esc(x)}</span><span style="white-space:nowrap">${b}</span></div></div>`}
async function puInit(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){PU='na';return render()}
try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();PU=Notification.permission==='denied'?'denied':sub?'on':'off';if(sub)jpost('/api/push/subscribe',sub.toJSON())}catch(e){PU='na'}render()}
async function puAct(a){try{if(a==='on'){const p=await Notification.requestPermission();if(p!=='granted'){PU=p==='denied'?'denied':'off';return render()}
const reg=await navigator.serviceWorker.ready;const r0=await fetch('/api/push/key');if(!r0.ok)throw new Error(t('Server ohne Schlüssel'));const k=(await r0.json()).key;
const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(k)});const r=await jpost('/api/push/subscribe',sub.toJSON());if(!r.ok)throw new Error(t('Registrierung {n}',{n:r.status}));PU='on'}
else if(a==='off'){const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await jpost('/api/push/unsubscribe',{endpoint:sub.endpoint});await sub.unsubscribe()}PU='off'}
else if(a==='test'){const j=await (await jpost('/api/push/test')).json();$('#gen').textContent=t('Test an {s}/{d} Gerät(e)',{s:j.sent,d:j.devices});return}
render()}catch(e){$('#gen').textContent=t('Mitteilungen: {e}',{e:e.message})}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').then(puInit,()=>{PU='na';render()});else PU='na';
