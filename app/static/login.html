<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QuietBoard – Anmeldung</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1d1d1b;--tx2:#6b6b66;--bd:#e3e2dc;--bad:#c93a3a;--acc:#2f6fd0;--chip:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--tx:#e9e9e6;--tx2:#a5a7ab;--bd:#2c313a;--chip:#252a33;--bad:#e05757;--acc:#6aa0f0}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 16px 32px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}p{color:var(--tx2);margin:0 0 20px;font-size:14px}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--tx2)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px}
code{background:var(--chip);border-radius:6px;padding:1px 6px;font-size:13px}
.hint{font-size:13px;color:var(--tx2);margin-top:14px}
</style>
</head>
<body>
<main>
  <h1 id="h">QuietBoard</h1>
  <p id="sub">Anmelden</p>
  <form id="f" autocomplete="on">
    <label id="codeL" hidden>Einrichtungscode
      <input id="code" name="code" autocomplete="one-time-code" autocapitalize="characters" placeholder="XXXX-XXXX"></label>
    <label id="nameL" hidden>Name (optional)<input id="name" name="name" autocomplete="name"></label>
    <label>E-Mail<input id="email" name="email" type="email" autocomplete="username" required></label>
    <label>Passwort<input id="password" name="password" type="password" autocomplete="current-password" required minlength="10"></label>
    <div class="err" id="err" role="alert"></div>
    <button id="btn" type="submit">Anmelden</button>
  </form>
  <div class="hint" id="hint" hidden>Der Einrichtungscode steht im Log des Servers:<br><code>docker compose logs status | grep Einrichtungscode</code></div>
</main>
<script>
const $ = s => document.querySelector(s);
let setup = false;
async function init() {
  const st = await (await fetch('/api/auth/state', {cache: 'no-store'})).json();
  if (st.user && !st.setup_needed) { location.replace('/'); return; }
  setup = st.setup_needed;
  document.title = 'QuietBoard – ' + (setup ? 'Einrichtung' : 'Anmeldung');
  $('#h').textContent = st.site ? 'QuietBoard · ' + st.site : 'QuietBoard';
  if (setup) {
    $('#sub').textContent = 'Willkommen! Lege das Admin-Konto an. Es gilt nur für diese App – Healthchecks und Beszel haben eigene Zugänge (ADMIN_EMAIL in .env).';
    $('#codeL').hidden = $('#nameL').hidden = $('#hint').hidden = false;
    $('#code').required = true;
    $('#password').autocomplete = 'new-password';
    $('#btn').textContent = 'Admin-Konto anlegen';
    if (location.pathname !== '/setup') history.replaceState(null, '', '/setup');
  } else if (location.pathname !== '/login') history.replaceState(null, '', '/login');
}
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = ''; $('#btn').disabled = true;
  const body = {email: $('#email').value, password: $('#password').value};
  if (setup) Object.assign(body, {code: $('#code').value, name: $('#name').value});
  try {
    const r = await fetch(setup ? '/api/auth/setup' : '/api/auth/login',
      {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || 'Fehler ' + r.status);
    location.replace(setup ? '/?t=sy' : '/');
  } catch (err) { $('#err').textContent = err.message; }
  finally { $('#btn').disabled = false; }
});
init();
</script>
</body>
</html>
