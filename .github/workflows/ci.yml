name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # vom Image-Workflow: erst testen, dann bauen

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks prüft die ganze Historie
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pre-commit (gitleaks, ruff)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks über die ganze Git-Historie (nicht nur den aktuellen Stand)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Tests
        run: pytest -q
      - name: Bekannte Sicherheitslücken in den festgelegten Paketen (pip-audit)
        run: |
          python -m venv /tmp/audit && /tmp/audit/bin/pip install -q pip-audit==2.10.1
          /tmp/audit/bin/pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: shellcheck (gleiche Version wie make lint)
        run: |
          shopt -s nullglob
          docker run --rm -e LANG=C.UTF-8 -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 install.sh hosts/*.sh hosts/hc hosts/updates-report generate-env.sh dev/fakehost/run.sh scripts/*.sh deploy/*/*.sh
      - name: Lizenzen (keine unerwartete Copyleft-Lizenz im Image)
        run: |
          python -m venv /tmp/img && /tmp/img/bin/pip install -q --require-hashes --no-deps -r requirements.lock
          /tmp/img/bin/pip install -q pip-licenses==5.5.5
          # Ausnahmen begründet in docs/decisions/0004-lizenz-certifi-mpl.md
          /tmp/img/bin/pip-licenses --partial-match --fail-on "GPL;AGPL;LGPL;MPL;EUPL;SSPL;BUSL" \
            --ignore-packages pip-licenses prettytable wcwidth certifi

  e2e:
    runs-on: ubuntu-24.04
    needs: lint-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Frische Installation hochfahren und prüfen
        run: scripts/e2e.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Doku bauen, Deutsch und Englisch (strict – bricht bei kaputten Links ab)
        run: |
          NO_MKDOCS_2_WARNING=1 mkdocs build --strict -d site
          NO_MKDOCS_2_WARNING=1 mkdocs build --strict -f mkdocs.en.yml -d site/en
