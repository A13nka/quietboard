name: Image
# main        → :edge (+ :sha-…)
# Tag v1.2.3  → :v1.2.3, :v1.2, :v1, :latest  und ein GitHub-Release mit Notizen
# Tag v1.3.0-rc1 (Vorabversion) → nur :v1.3.0-rc1, kein :latest/:v1/:v1.3
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Erst die komplette CI (Lint, Tests, e2e), dann bauen – auch für Tags
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=match,pattern=^(v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$,group=1
            type=match,pattern=^(v\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^(v\d+)\.\d+\.\d+$,group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installationspaket, install.sh, compose.yaml (auf diese Version festgelegt)
        run: scripts/make-dist.sh "${GITHUB_REF_NAME}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name in Kleinbuchstaben (GHCR verlangt das, der Repo-Besitzer kann Großbuchstaben haben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: SBOM des Images (SPDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: dist/quietboard-${{ github.ref_name }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Prüfsummen
        run: cd dist && rm -f SHA256SUMS && sha256sum -- * > ../SHA256SUMS.tmp && mv ../SHA256SUMS.tmp SHA256SUMS && cat SHA256SUMS
      - name: GitHub-Release mit Notizen und Dateien
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease";; esac
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = index($0, v) == 1; next} p' CHANGELOG.md)
          repo="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ${notes:-Siehe CHANGELOG.md}

          ## Installation

          Server (Debian/Ubuntu mit Docker), genau diese Version:

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | ADMIN_EMAIL=du@example.org bash
          \`\`\`

          Oder \`quietboard-${GITHUB_REF_NAME}.tar.gz\` entpacken und \`ADMIN_EMAIL=… ./install.sh\` ausführen.

          ## Images

          \`ghcr.io/${repo}:${GITHUB_REF_NAME}\` – außerdem die Kurz-Tags \`v<Major>\`, \`v<Major>.<Minor>\` und \`latest\` (nicht bei Vorabversionen).

          Prüfsummen: \`SHA256SUMS\` · Stückliste: \`*.sbom.spdx.json\`
          EOF
          gh release create "$GITHUB_REF_NAME" $pre --title "QuietBoard ${GITHUB_REF_NAME}" --notes-file notes.md dist/*
